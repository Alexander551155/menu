<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
>

<meta name="theme-color" content="#292b29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sektstand">
<meta name="mobile-web-app-capable" content="yes">

<title>Sektstand Rechner</title>

<style>

:root{

  --bg:#f6f4f1;

  --card:#ffffff;

  --ink:#252725;

  --muted:#747774;

  --line:#dedbd6;


  /* =========================
     DUNKLER / KONTRASTREICHER
     ========================= */

  --anthrazit:#424542;

  --anthrazit-dark:#292b29;

  --anthrazit-soft:#565956;


  /* FAVORITE AKZENT */

  --pink:#a84f79;

  --pink-dark:#8f4167;

  --pink-soft:#f0e2e9;


  --green:#23864e;

  --gold:#cbb88e;

}


*{
  box-sizing:border-box;
}


html,
body{

  margin:0;

  min-height:100%;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:var(--bg);

  color:var(--ink);

  -webkit-text-size-adjust:100%;

  touch-action:manipulation;

}


body{

  padding-top:
    env(safe-area-inset-top);

}


button,
input{

  font:inherit;

}


button{

  -webkit-tap-highlight-color:
    transparent;

  touch-action:
    manipulation;

}



/* =========================================================
   KOPF
   ========================================================= */

header{

  position:sticky;

  top:0;

  z-index:40;


  background:

    linear-gradient(

      135deg,

      #3b3e3b,

      #272927

    );


  color:#fff;


  padding:

    8px

    10px

    7px;


  border-bottom:

    3px solid

    var(--pink);


  box-shadow:

    0 3px 12px

    #0005;

}


.headrow{

  display:flex;

  align-items:center;

  justify-content:
    space-between;

  gap:8px;

}


.brand-small{

  font-size:8px;

  font-weight:950;

  letter-spacing:
    1.4px;

  color:#f3dce8;

  margin-bottom:2px;

}


.title{

  font-size:19px;

  font-weight:950;

  line-height:1;

  color:#fff;

}


.hint{

  font-size:10px;

  color:#eeeeee;

  margin-top:3px;

}



/* =========================================================
   PFAND
   ========================================================= */

.pfand-mini{

  display:flex;

  gap:6px;

}


.pfand-mini button{

  border:0;

  border-radius:10px;

  min-height:38px;

  padding:

    0

    10px;

  font-weight:950;

  font-size:13px;


  box-shadow:

    0 2px 5px

    #0003;

}


.pfand-plus{

  background:#f6dfb2;

  color:#252525;

}


.pfand-minus{

  background:#dcefe2;

  color:#20452b;

}



/* =========================================================
   KATEGORIEN
   ========================================================= */

.tabs{

  position:sticky;

  top:62px;

  z-index:35;


  display:grid;

  grid-template-columns:

    repeat(
      5,
      1fr
    );


  gap:5px;


  padding:

    6px

    6px

    7px;


  background:#f6f4f1ee;


  backdrop-filter:
    blur(9px);


  border-bottom:

    1px solid

    #ddd9d3;

}


.tab{

  border:

    1px solid

    #e3dfda;


  border-radius:10px;


  min-height:40px;


  background:#fff;


  color:

    var(--anthrazit-dark);


  font-size:12px;

  font-weight:950;


  padding:4px;

}


.tab.active{

  background:

    linear-gradient(

      180deg,

      #414441,

      #292b29

    );


  color:#fff;


  border:

    2px solid

    var(--pink);


  box-shadow:

    0 2px 7px

    #0004;

}



/* =========================================================
   HAUPTBEREICH
   ========================================================= */

main{

  max-width:760px;


  margin:

    0 auto;


  padding:

    6px

    7px

    calc(

      132px +

      env(safe-area-inset-bottom)

    );

}


.section{

  display:none;

}


.section.active{

  display:block;

}



/* =========================================================
   FAVORITE LOGO IM SEKT-BEREICH
   ========================================================= */

#sekt{

  position:relative;

}


#sekt::before{

  content:"";


  position:absolute;


  inset:

    60px

    0

    0

    0;


  background:

    url("favorite-logo.png")

    center 42%

    / 78% auto

    no-repeat;


  opacity:.035;


  pointer-events:none;


  z-index:0;

}


#sekt > *{

  position:relative;

  z-index:1;

}



/* =========================================================
   LOGO-BALKEN
   ========================================================= */

.sekt-brand{

  min-height:58px;


  display:flex;

  align-items:center;

  justify-content:center;


  margin:

    0

    0

    7px;


  padding:

    7px

    12px;


  border:

    1px solid

    #666966;


  border-radius:13px;


  background:

    linear-gradient(

      135deg,

      #454845,

      #2c2e2c

    );


  box-shadow:

    0 3px 9px

    #0004;


  overflow:hidden;

}


.sekt-brand img{

  display:block;


  max-width:78%;

  max-height:48px;


  width:auto;

  height:auto;


  object-fit:contain;


  filter:

    brightness(1.8)

    contrast(.95);

}



/* FALLBACK FALLS LOGO NICHT GELADEN WIRD */

.logo-fallback{

  display:none;


  color:#fff;


  text-align:center;


  font-weight:950;


  line-height:1;

}


.logo-fallback strong{

  display:block;


  font-family:

    Georgia,

    "Times New Roman",

    serif;


  font-size:24px;

}


.logo-fallback span{

  display:block;


  margin-top:3px;


  font-size:13px;


  color:#ead7e1;

}



/* =========================================================
   PRODUKTKARTEN
   ========================================================= */

.grid{

  display:grid;


  grid-template-columns:

    1fr 1fr;


  gap:6px;

}


.item{

  background:

    rgba(
      255,
      255,
      255,
      .97
    );


  border:

    1px solid

    var(--line);


  border-radius:12px;


  padding:7px;


  box-shadow:

    0 1px 5px

    #00000014;

}


.item.full{

  grid-column:
    1/-1;

}


.item-name{

  font-size:14px;


  font-weight:950;


  line-height:1.08;


  margin-bottom:6px;


  min-height:30px;

}


.item-sub{

  font-size:10px;


  color:

    var(--muted);


  line-height:1.1;


  margin-top:-2px;


  margin-bottom:5px;

}



/* =========================================================
   PREISBUTTONS
   ========================================================= */

.options{

  display:grid;


  grid-template-columns:

    repeat(
      var(--cols,1),
      1fr
    );


  gap:5px;

}


.option{

  position:relative;


  border:

    1px solid

    #e0e0e0;


  border-radius:10px;


  min-height:49px;


  padding:

    5px

    3px;


  background:

    linear-gradient(

      180deg,

      #f2f2f2,

      #e7e7e7

    );


  color:#202020;


  font-weight:950;

}


.option:active{

  transform:

    scale(.98);

}


.option .size{

  display:block;


  font-size:12px;

}


.option .price{

  display:block;


  font-size:16px;


  margin-top:2px;

}



/* =========================================================
   MENGE / KLEINE ZAHL
   ========================================================= */

.option .qty{

  display:none;


  position:absolute;


  top:-7px;

  right:-7px;


  min-width:25px;

  height:25px;


  padding:

    0

    6px;


  border-radius:999px;


  align-items:center;

  justify-content:center;


  background:

    var(--pink);


  color:#fff;


  border:

    2px solid

    #fff;


  box-shadow:

    0 2px 6px

    #0004;


  font-size:12px;

  font-weight:950;


  z-index:3;

}


.option.selected{

  outline:

    2px solid

    var(--anthrazit-dark);


  background:

    #fff7fb;


  box-shadow:

    0 0 0 2px

    #a84f7945;

}


.option.selected .qty{

  display:flex;

}



/* =========================================================
   SOFT / APERITIF / SNACK
   ========================================================= */

.single-grid{

  display:grid;


  grid-template-columns:

    1fr 1fr;


  gap:6px;

}


.single-card{

  background:#fff;


  border:

    1px solid

    var(--line);


  border-radius:12px;


  padding:7px;


  box-shadow:

    0 1px 5px

    #00000010;

}


.single-name{

  font-size:13px;


  font-weight:950;


  line-height:1.05;


  min-height:30px;

}


.single-card .option{

  width:100%;


  margin-top:5px;

}



/* =========================================================
   SUMME UNTEN
   ========================================================= */

.bottom{

  position:fixed;


  left:0;

  right:0;

  bottom:0;


  z-index:50;


  background:#fff;


  border-top:

    3px solid

    var(--pink);


  box-shadow:

    0 -7px 24px

    #0003;

}


.bottom-inner{

  max-width:760px;


  margin:auto;


  padding:

    7px

    8px

    calc(

      7px +

      env(safe-area-inset-bottom)

    );

}


.sumrow{

  display:flex;


  align-items:center;


  gap:7px;

}


.count{

  background:

    var(--anthrazit);


  color:#fff;


  border-radius:999px;


  padding:

    5px

    8px;


  font-size:11px;


  font-weight:900;

}


.sumlabel{

  font-size:16px;


  font-weight:950;

}


.total{

  margin-left:auto;


  font-size:30px;


  font-weight:1000;


  letter-spacing:-1px;


  color:

    var(--anthrazit-dark);

}



/* =========================================================
   BUTTONS UNTEN
   ========================================================= */

.controls{

  display:grid;


  grid-template-columns:

    .85fr

    1fr

    1fr;


  gap:6px;


  margin-top:6px;

}


.controls button{

  border:0;


  border-radius:11px;


  min-height:44px;


  font-weight:950;


  font-size:13px;

}


.undo{

  background:#eeeeee;


  color:#353535;

}


.cash{

  background:

    linear-gradient(

      180deg,

      #2a9659,

      #207746

    );


  color:#fff;

}


.reset{

  background:

    linear-gradient(

      180deg,

      #444744,

      #292b29

    );


  color:#fff;


  box-shadow:

    0 2px 6px

    #0003;

}



/* =========================================================
   BARZAHLUNG
   ========================================================= */

dialog{

  border:0;


  padding:0;


  border-radius:18px;


  width:

    min(

      480px,

      calc(
        100% - 20px
      )

    );


  box-shadow:

    0 25px 80px

    #0007;

}


dialog::backdrop{

  background:#0009;

}


.modal{

  padding:16px;


  background:#fff;

}


.modal h2{

  margin:

    0

    0

    8px;


  color:

    var(--anthrazit-dark);


  font-size:23px;

}


.to-pay-label{

  font-size:13px;


  color:#666;

}


.to-pay{

  font-size:36px;


  font-weight:1000;


  color:

    var(--anthrazit-dark);

}



/* =========================================================
   SCHNELLBETRÄGE
   ========================================================= */

.quick-cash{

  display:grid;


  grid-template-columns:

    repeat(
      4,
      1fr
    );


  gap:6px;


  margin:

    12px

    0

    10px;

}


.quick-cash button{

  min-height:48px;


  border:

    1px solid

    #dedede;


  border-radius:10px;


  background:#f3f3f3;


  font-weight:950;

}



/* =========================================================
   GAST GIBT
   ========================================================= */

.cash-label{

  display:block;


  font-size:13px;


  font-weight:800;


  margin-bottom:4px;

}


#cashInput{

  width:100%;


  padding:11px;


  border:

    2px solid

    #aaa;


  border-radius:11px;


  font-size:26px;


  font-weight:900;


  outline:none;

}


#cashInput:focus{

  border-color:

    var(--pink);

}



/* =========================================================
   RÜCKGELD
   ========================================================= */

.change-box{

  margin-top:10px;


  background:#f3f1f2;


  border-radius:12px;


  padding:10px;

}


.change-label{

  font-size:13px;


  color:#666;

}


.change{

  font-size:34px;


  font-weight:1000;

}



/* =========================================================
   MODAL BUTTONS
   ========================================================= */

.modal-buttons{

  display:grid;


  grid-template-columns:

    1fr 1fr;


  gap:7px;


  margin-top:12px;

}


.modal-buttons button{

  min-height:50px;


  border:0;


  border-radius:11px;


  font-weight:950;


  font-size:14px;

}


.cancel{

  background:#eee;

}


.paid{

  background:

    linear-gradient(

      180deg,

      #444744,

      #292b29

    );


  color:#fff;

}



/* =========================================================
   KLEINE HANDYS
   ========================================================= */

@media(max-width:380px){

  .title{

    font-size:17px;

  }


  .brand-small{

    font-size:7px;

  }


  .pfand-mini button{

    padding:

      0

      8px;


    font-size:12px;

  }


  .tabs{

    top:60px;

  }


  .tab{

    font-size:11px;

  }


  .item-name{

    font-size:13px;

  }


  .option .price{

    font-size:15px;

  }


  .sekt-brand{

    min-height:52px;

  }


  .sekt-brand img{

    max-height:42px;

  }

}

</style>
</head>

  </div>

<!-- =========================================================

  </button>



  <button

      showTab(
        'aperitif',

    🍹 Aperitif

  </button>



  <button

    🥨 Snack

</nav>



<!-- =========================================================
     INHALT
     ========================================================= -->

<main>


  <section

    id="sekt"

    class="section active"

  ></section>



  <section

    id="wein"

    class="section"

  ></section>



  <section

    id="soft"

    class="section"

  ></section>



  <section

    id="aperitif"

    class="section"

  ></section>



  <section

    id="snack"

    class="section"

  ></section>


</main>



<!-- =========================================================
     SUMME
     ========================================================= -->

<div class="bottom">


  <div class="bottom-inner">


    <div class="sumrow">


      <span

        class="count"

        id="count"

      >

        0 Artikel

      </span>



      <span class="sumlabel">

        Summe

      </span>



      <span

        class="total"

        id="total"

      >

        0,00 €

      </span>


    </div>



    <div class="controls">


      <button

        class="undo"

        onclick="
          undo()
        "
      >

        ↶ Zurück

      </button>



      <button

        class="cash"

        onclick="
          openCash()
        "
      >

        💶 BAR

      </button>



      <button

        class="reset"

        onclick="
          resetCart()
        "
      >

        NEUER GAST

      </button>


    </div>


  </div>


</div>



<!-- =========================================================
     BARZAHLUNG
     ========================================================= -->

<dialog id="cashDialog">


  <div class="modal">


    <h2>

      💶 Barzahlung

    </h2>



    <div class="to-pay-label">

      Gast muss zahlen

    </div>



    <div

      class="to-pay"

      id="cashTotal"

    >

      0,00 €

    </div>



    <div

      class="quick-cash"

      id="quickCash"

    ></div>



    <label

      class="cash-label"

      for="cashInput"

    >

      Gast gibt:

    </label>



    <input

      id="cashInput"

      type="text"

      inputmode="decimal"

      autocomplete="off"

      placeholder="z. B. 20"

      oninput="
        calculateChange()
      "

    >



    <div class="change-box">


      <div class="change-label">

        Rückgeld

      </div>



      <div

        class="change"

        id="change"

      >

        0,00 €

      </div>


    </div>



    <div class="modal-buttons">


      <button

        class="cancel"

        onclick="
          cashDialog.close()
        "
      >

        Abbrechen

      </button>



      <button

        class="paid"

        onclick="
          finishSale()
        "
      >

        BEZAHLT / NEUER GAST

      </button>


    </div>


  </div>


</dialog>

/* =========================================================
   WARENKORB
   ========================================================= */

let cart = {};

let history = [];



/* =========================================================
   EURO FORMAT
   ========================================================= */

function eur(number){


  const cleanNumber =

    Number(number);


  if(

    !Number.isFinite(
      cleanNumber
    )

  ){


    return "0,00 €";


  }


  return cleanNumber.toLocaleString(

    "de-DE",

    {

      style:
        "currency",

      currency:
        "EUR"

    }

  );

}



/* =========================================================
   PRODUKT SCHLÜSSEL
   ========================================================= */

function keyFor(
  name,
  size
){


  return

    String(name) +

    "||" +

    String(size);

}



/* =========================================================
   EINDEUTIGE BUTTON-ID
   ========================================================= */

function safeId(text){


  const value =

    String(text);


  let hash =

    2166136261;


  for(

    let i = 0;

    i < value.length;

    i++

  ){


    hash ^=

      value.charCodeAt(i);


    hash =

      Math.imul(

        hash,

        16777619

      );

  }


  return

    "q-" +

    (hash >>> 0)
      .toString(36);

}



/* =========================================================
   SEKT UND WEIN ANZEIGEN
   ========================================================= */

function renderMulti(
  id,
  items
){


  document

    .getElementById(
      id
    )

    .innerHTML =


      `<div class="grid">` +


      items.map(

        item => {


          const full =

            item.opts.length === 3

            ? " full"

            : "";


          return `


            <div class="item${full}">


              <div class="item-name">

                ${item.name}

              </div>


              ${

                item.sub

                ? `

                    <div class="item-sub">

                      ${item.sub}

                    </div>

                  `

                : ""

              }


              <div

                class="options"

                style="
                  --cols:
                  ${item.opts.length}
                "
              >


                ${

                  item.opts.map(

                    ([size,price]) => {


                      const key =

                        keyFor(

                          item.name,

                          size

                        );


                      return `


                        <button

                          class="option"

                          id="${safeId(key)}"

                          onclick='

                            add(

                              ${JSON.stringify(
                                item.name +
                                " · " +
                                size
                              )},

                              ${Number(price)},

                              ${JSON.stringify(
                                key
                              )}

                            )

                          '
                        >


                          <span class="qty">

                            0

                          </span>


                          <span class="size">

                            ${size}

                          </span>


                          <span class="price">

                            ${eur(price)}

                          </span>


                        </button>


                      `;


                    }

                  ).join("")

                }


              </div>


            </div>


          `;


        }

      ).join("") +


      `</div>`;

}

function showTab(

){

      section =>

        section
          .classList
          .remove(

          )

    .add(
      "active"
    );

    .querySelectorAll(
      ".tab"

        tab
          .classList

            "active"

      "active"
    );



  window.scrollTo({

    top:0,

    behavior:"auto"

  });

/* =========================================================
   VERLAUF
   ========================================================= */

function snapshot(){


  history.push(

    JSON.stringify(
      cart
    )

  );


  if(
    history.length > 50
  ){

    history.shift();

  }

}



/* =========================================================
   ARTIKEL HINZUFÜGEN
   ========================================================= */

function add(
  name,
  price,
  key
){


  const cleanPrice =

    Number(price);


  if(

    !Number.isFinite(
      cleanPrice
    )

  ){


    return;

  }



  snapshot();



  if(
    !cart[key]
  ){


    cart[key] = {


      name:
        String(name),


      price:
        cleanPrice,


      qty:
        0


    };

  }



  cart[key].qty =

    Number(
      cart[key].qty
    ) + 1;



  update();



  if(
    navigator.vibrate
  ){


    navigator.vibrate(
      15
    );

  }

}



/* =========================================================
   ZURÜCK
   ========================================================= */

function undo(){


  if(
    !history.length
  ){


    return;

  }



  cart =

    JSON.parse(

      history.pop()

    );



  update();

}



/* =========================================================
   NEUER GAST
   ========================================================= */

function resetCart(){


  cart = {};


  history = [];


  update();

}



/* =========================================================
   SUMME
   ========================================================= */

function getTotal(){


  let total =
    0;



  for(

    const item

    of Object.values(
      cart
    )

  ){


    const price =

      Number(
        item.price
      );


    const qty =

      Number(
        item.qty
      );



    if(

      Number.isFinite(price)

      &&

      Number.isFinite(qty)

    ){


      total +=

        price * qty;

    }

  }



  if(

    !Number.isFinite(
      total
    )

  ){


    return 0;

  }



  return

    Math.round(

      total * 100

    ) / 100;

}



/* =========================================================
   ARTIKELANZAHL
   ========================================================= */

function getCount(){


  let count =
    0;



  for(

    const item

    of Object.values(
      cart
    )

  ){


    const qty =

      Number(
        item.qty
      );


    if(

      Number.isFinite(
        qty
      )

    ){


      count +=
        qty;

    }

  }



  return count;

}



/* =========================================================
   ANZEIGE AKTUALISIEREN
   ========================================================= */

function update(){


  document

    .querySelectorAll(
      ".option"
    )

    .forEach(

      button => {


        button

          .classList

          .remove(
            "selected"
          );



        const quantity =

          button.querySelector(
            ".qty"
          );



        if(
          quantity
        ){


          quantity.textContent =
            "0";

        }


      }

    );



  for(

    const [
      key,
      item
    ]

    of Object.entries(
      cart
    )

  ){


    const qty =

      Number(
        item.qty
      );



    if(

      !Number.isFinite(qty)

      ||

      qty <= 0

    ){


      continue;

    }



    if(

      key !==
      "pfand-plus"

      &&

      key !==
      "pfand-minus"

    ){


      const button =

        document.getElementById(

          safeId(
            key
          )

        );



      if(
        button
      ){


        button

          .classList

          .add(
            "selected"
          );



        const badge =

          button.querySelector(
            ".qty"
          );



        if(
          badge
        ){


          badge.textContent =
            qty;

        }

      }

    }

  }



  document

    .getElementById(
      "count"
    )

    .textContent =

      getCount() +

      " Artikel";



  document

    .getElementById(
      "total"
    )

    .textContent =

      eur(
        getTotal()
      );

}

  const total =

  if(

  setTimeout(

      document

        .getElementById(
          "cashInput"
        )

        .focus();

  );

}



/* =========================================================
   SCHNELLBETRÄGE
   ========================================================= */

function createQuickCash(total){


  const standard =

    [
      5,
      10,
      20,
      50,
      100,
      200
    ];



  let buttons =

    standard

      .filter(

        amount =>
          amount >= total

      )

      .slice(
        0,
        4
      );



  if(
    buttons.length < 4
  ){


    buttons =

      standard.slice(
        -4
      );

  }



  document

    .getElementById(
      "quickCash"
    )

    .innerHTML =

      buttons.map(

        amount => `


          <button

            onclick="
              setCash(
                ${amount}
              )
            "
          >

            ${amount} €

          </button>


        `

      ).join("");

}



/* =========================================================
   SCHNELLBETRAG SETZEN
   ========================================================= */

function setCash(amount){


  document

    .getElementById(
      "cashInput"
    )

    .value =

      amount;



  calculateChange();

}



/* =========================================================
   KOMMA / PUNKT
   ========================================================= */

function parseCashValue(value){


  const parsed =

    Number(

      String(value)

        .trim()

        .replace(
          /\s/g,
          ""
        )

        .replace(
          ",",
          "."
        )

    );



  return

    Number.isFinite(
      parsed
    )

    ? parsed

    : 0;

}



/* =========================================================
   RÜCKGELD
   ========================================================= */

function calculateChange(){


  const total =

    getTotal();



  const given =

    parseCashValue(

      document

        .getElementById(
          "cashInput"
        )

        .value

    );



  const difference =

    Math.round(

      (
        given -
        total
      ) * 100

    ) / 100;



  const changeElement =

    document

      .getElementById(
        "change"
      );



  if(
    difference >= 0
  ){


    changeElement

      .textContent =

        eur(
          difference
        );



    changeElement

      .style

      .color =

        "#23864e";

  }


  else{


    changeElement

      .textContent =

        "Fehlen " +

        eur(

          Math.abs(
            difference
          )

        );



    changeElement

      .style

      .color =

        "#a84f79";

  }

}



/* =========================================================
   BEZAHLT
   ========================================================= */

function finishSale(){


  const total =

    getTotal();



  const given =

    parseCashValue(

      document

        .getElementById(
          "cashInput"
        )

        .value

    );



  if(
    given < total
  ){


    alert(
      "Der Gast hat noch nicht genug gegeben."
    );


    return;

  }



  document

    .getElementById(
      "cashDialog"
    )

    .close();



  resetCart();

}
