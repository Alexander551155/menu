<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sektstand">
<meta name="mobile-web-app-capable" content="yes">
<title>Sektstand Rechner</title>

<style>
:root{
  --bg:#f3efe6;
  --card:#fff;
  --ink:#111;
  --muted:#6d6d6d;
  --line:#ddd6ca;
  --green:#168a45;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-text-size-adjust:100%;
  touch-action:manipulation
}

body{
  padding-top:env(safe-area-inset-top)
}

button,input{
  font:inherit
}

button{
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation
}


/* KOPF */

header{
  position:sticky;
  top:0;
  z-index:40;
  background:#111;
  color:#fff;
  padding:8px 10px 7px;
  box-shadow:0 2px 10px #0002
}

.headrow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px
}

.title{
  font-size:20px;
  font-weight:950;
  line-height:1
}

.hint{
  font-size:11px;
  opacity:.7;
  margin-top:3px
}


/* PFAND OBEN */

.pfand-mini{
  display:flex;
  gap:6px
}

.pfand-mini button{
  border:0;
  border-radius:10px;
  min-height:38px;
  padding:0 10px;
  font-weight:950;
  font-size:13px
}

.pfand-plus{
  background:#ffe7a3
}

.pfand-minus{
  background:#daf0df
}


/* KATEGORIEN */

.tabs{
  position:sticky;
  top:55px;
  z-index:35;

  display:grid;
  grid-template-columns:repeat(5,1fr);

  gap:5px;

  padding:6px 6px 7px;

  background:#f3efe6eF;

  backdrop-filter:blur(8px);

  border-bottom:1px solid #ddd6ca
}

.tab{
  border:0;
  border-radius:10px;

  min-height:40px;

  background:#fff;

  font-size:12px;
  font-weight:900;

  padding:4px
}

.tab.active{
  background:#111;
  color:#fff
}


/* INHALT */

main{
  max-width:760px;
  margin:0 auto;

  padding:
    6px
    7px
    calc(
      132px +
      env(safe-area-inset-bottom)
    )
}

.section{
  display:none
}

.section.active{
  display:block
}


/* MEHRERE ARTIKEL */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px
}

.item{
  background:var(--card);

  border:1px solid var(--line);

  border-radius:12px;

  padding:7px;

  box-shadow:0 1px 4px #0000000b
}

.item.full{
  grid-column:1/-1
}

.item-name{
  font-size:14px;
  font-weight:900;

  line-height:1.08;

  margin-bottom:6px;

  min-height:30px
}

.item-sub{
  font-size:10px;
  color:var(--muted);

  line-height:1.1;

  margin-top:-2px;
  margin-bottom:5px
}


/* PREISE */

.options{
  display:grid;

  grid-template-columns:
    repeat(
      var(--cols,1),
      1fr
    );

  gap:5px
}

.option{
  position:relative;

  border:0;

  border-radius:10px;

  min-height:48px;

  padding:5px 3px;

  background:#ececec;

  color:#111;

  font-weight:950
}

.option:active{
  transform:scale(.985)
}

.option .size{
  display:block;
  font-size:12px
}

.option .price{
  display:block;
  font-size:16px;
  margin-top:2px
}


/* MENGE */

.option .qty{
  display:none;

  position:absolute;

  top:-6px;
  right:-6px;

  min-width:24px;
  height:24px;

  padding:0 6px;

  border-radius:999px;

  align-items:center;
  justify-content:center;

  background:#111;

  color:#fff;

  border:2px solid #fff;

  font-size:12px;
  font-weight:950
}

.option.selected{
  outline:2px solid #111;
  background:#f7f7f7
}

.option.selected .qty{
  display:flex
}


/* EINZELARTIKEL */

.single-grid{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:6px
}

.single-card{
  background:#fff;

  border:1px solid var(--line);

  border-radius:12px;

  padding:7px
}

.single-name{
  font-size:13px;
  font-weight:900;

  line-height:1.05;

  min-height:30px
}

.single-card .option{
  width:100%;
  margin-top:5px
}


/* SUMME UNTEN */

.bottom{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:50;

  background:#fff;

  border-top:1px solid #d5d5d5;

  box-shadow:0 -7px 22px #0002
}

.bottom-inner{
  max-width:760px;

  margin:auto;

  padding:
    7px
    8px
    calc(
      7px +
      env(safe-area-inset-bottom)
    )
}

.sumrow{
  display:flex;
  align-items:center;
  gap:7px
}

.count{
  background:#111;

  color:#fff;

  border-radius:999px;

  padding:5px 8px;

  font-size:11px;
  font-weight:900
}

.sumlabel{
  font-size:16px;
  font-weight:900
}

.total{
  margin-left:auto;

  font-size:30px;
  font-weight:1000;

  letter-spacing:-1px
}


/* BUTTONS UNTEN */

.controls{
  display:grid;

  grid-template-columns:
    .85fr
    1fr
    1fr;

  gap:6px;

  margin-top:6px
}

.controls button{
  border:0;

  border-radius:11px;

  min-height:44px;

  font-weight:950;

  font-size:13px
}

.undo{
  background:#eee
}

.cash{
  background:#16a34a;
  color:#fff
}

.reset{
  background:#111;
  color:#fff
}


/* BARZAHLUNG */

dialog{
  border:0;
  padding:0;

  border-radius:18px;

  width:
    min(
      480px,
      calc(100% - 20px)
    );

  box-shadow:
    0 25px 80px
    #0007
}

dialog::backdrop{
  background:#0009
}

.modal{
  padding:16px
}

.modal h2{
  margin:0 0 8px;
  font-size:23px
}

.to-pay-label{
  font-size:13px;
  color:#666
}

.to-pay{
  font-size:36px;
  font-weight:1000
}


/* SCHNELLBETRÄGE */

.quick-cash{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:6px;

  margin:
    12px
    0
    10px
}

.quick-cash button{
  min-height:48px;

  border:0;

  border-radius:10px;

  background:#eee;

  font-weight:950
}


/* GELD EINGABE */

.cash-label{
  display:block;

  font-size:13px;
  font-weight:800;

  margin-bottom:4px
}

#cashInput{
  width:100%;

  padding:11px;

  border:
    2px solid
    #aaa;

  border-radius:11px;

  font-size:26px;
  font-weight:900;

  outline:none
}

#cashInput:focus{
  border-color:#111
}


/* RÜCKGELD */

.change-box{
  margin-top:10px;

  background:#f1f1f1;

  border-radius:12px;

  padding:10px
}

.change-label{
  font-size:13px;
  color:#666
}

.change{
  font-size:34px;
  font-weight:1000
}


/* BARZAHLUNG BUTTONS */

.modal-buttons{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:7px;

  margin-top:12px
}

.modal-buttons button{
  min-height:50px;

  border:0;

  border-radius:11px;

  font-weight:950;

  font-size:14px
}

.cancel{
  background:#eee
}

.paid{
  background:#111;
  color:#fff
}


/* KLEINE HANDYS */

@media(max-width:380px){

  .title{
    font-size:18px
  }

  .pfand-mini button{
    padding:0 8px;
    font-size:12px
  }

  .tabs{
    top:53px
  }

  .tab{
    font-size:11px
  }

  .item-name{
    font-size:13px
  }

  .option .price{
    font-size:15px
  }

}

</style>
</head>

<body>


<header>

  <div class="headrow">

    <div>

      <div class="title">
        🥂 Sektstand
      </div>

      <div class="hint">
        Antippen = Menge +1
      </div>

    </div>


    <div class="pfand-mini">

      <button
        class="pfand-plus"
        onclick="
          add(
            'Pfand',
            3,
            'pfand-plus'
          )
        "
      >
        +3 €
      </button>


      <button
        class="pfand-minus"
        onclick="
          add(
            'Pfandrückgabe',
            -3,
            'pfand-minus'
          )
        "
      >
        −3 €
      </button>

    </div>

  </div>

</header>



<!-- KATEGORIEN -->

<nav class="tabs">

  <button
    class="tab active"
    onclick="
      showTab(
        'sekt',
        this
      )
    "
  >
    🥂 Sekt
  </button>


  <button
    class="tab"
    onclick="
      showTab(
        'wein',
        this
      )
    "
  >
    🍷 Wein
  </button>


  <button
    class="tab"
    onclick="
      showTab(
        'soft',
        this
      )
    "
  >
    🥤 Soft
  </button>


  <button
    class="tab"
    onclick="
      showTab(
        'aperitif',
        this
      )
    "
  >
    🍹 Aperitif
  </button>


  <button
    class="tab"
    onclick="
      showTab(
        'snack',
        this
      )
    "
  >
    🥨 Snack
  </button>

</nav>



<main>

  <section
    id="sekt"
    class="section active"
  ></section>


  <section
    id="wein"
    class="section"
  ></section>


  <section
    id="soft"
    class="section"
  ></section>


  <section
    id="aperitif"
    class="section"
  ></section>


  <section
    id="snack"
    class="section"
  ></section>

</main>



<!-- SUMME UNTEN -->

<div class="bottom">

  <div class="bottom-inner">


    <div class="sumrow">

      <span
        class="count"
        id="count"
      >
        0 Artikel
      </span>


      <span class="sumlabel">
        Summe
      </span>


      <span
        class="total"
        id="total"
      >
        0,00 €
      </span>

    </div>



    <div class="controls">


      <button
        class="undo"
        onclick="undo()"
      >
        ↶ Zurück
      </button>


      <button
        class="cash"
        onclick="openCash()"
      >
        💶 BAR
      </button>


      <button
        class="reset"
        onclick="resetCart()"
      >
        NEUER GAST
      </button>


    </div>


  </div>

</div>



<!-- BARZAHLUNG -->

<dialog id="cashDialog">

  <div class="modal">


    <h2>
      💶 Barzahlung
    </h2>


    <div class="to-pay-label">
      Gast muss zahlen
    </div>


    <div
      class="to-pay"
      id="cashTotal"
    >
      0,00 €
    </div>


    <div
      class="quick-cash"
      id="quickCash"
    ></div>


    <label
      class="cash-label"
      for="cashInput"
    >
      Gast gibt:
    </label>


    <input
      id="cashInput"
      type="text"
      inputmode="decimal"
      autocomplete="off"
      placeholder="z. B. 20"
      oninput="calculateChange()"
    >


    <div class="change-box">


      <div class="change-label">
        Rückgeld
      </div>


      <div
        class="change"
        id="change"
      >
        0,00 €
      </div>


    </div>


    <div class="modal-buttons">


      <button
        class="cancel"
        onclick="
          cashDialog.close()
        "
      >
        Abbrechen
      </button>


      <button
        class="paid"
        onclick="finishSale()"
      >
        BEZAHLT / NEUER GAST
      </button>


    </div>


  </div>

</dialog>



<script>

/* ===============================
   PRODUKTE
   =============================== */

const data = {


  /* SEKT */

  sekt:[

    {
      name:
        "Fürst von Metternich Riesling",

      opts:[
        ["0,1 l",5],
        ["0,75 l",28]
      ]
    },


    {

        "Fürst von Metternich Rosé",

      opts:[
        ["0,1 l",5],
        ["0,75 l",28]
      ]
    },


    {
      name:
        "Fürst von Metternich Chardonnay",

      opts:[
        ["0,1 l",5],
        ["0,75 l",28]
      ]
    }

  ],



  /* WEIN */

  wein:[


    {
      name:
        "Nr. 1 Riesling Hofgut Laubenheimer Höhe",

      sub:
        "trocken",

      opts:[
        ["0,1",4],
        ["0,2",7],
        ["0,75",24.5]
      ]
    },


    {
      name:
        "Nr. 2 Riesling Gelblack",

      sub:
        "trocken",

      opts:[
        ["0,1",4.5],
        ["0,2",8],
        ["0,75",28]
      ]
    },


    {
      name:
        "Nr. 3 Riesling Gelblack",

      sub:
        "feinherb",

      opts:[
        ["0,1",4.5],
        ["0,2",8],
        ["0,75",28]
      ]
    },


    {
      name:
        "Nr. 4 Weißburgunder",

      sub:
        "trocken",

      opts:[
        ["0,1",4.5],
        ["0,2",8],
        ["0,75",28]
      ]
    },


    {
      name:
        "Nr. 5 Grauburgunder Réserve",

      sub:
        "trocken",

      opts:[
        ["0,1",3.5],
        ["0,2",6.5],
        ["0,75",22]
      ]
    },


    {
      name:
        "Nr. 6 Chardonnay",

      sub:
        "trocken",

      opts:[
        ["0,1",3.5],
        ["0,2",6.5],
        ["0,75",22]
      ]
    },


    {
      name:
        "Nr. 7 Rosé HASE",

      sub:
        "trocken",

      opts:[
        ["0,1",3.5],
        ["0,2",6.5],
        ["0,75",22]
      ]
    }

  ],



  /* SOFT */

  soft:[


    {
      name:"Weinschorle",
      size:"0,4 l",
      price:4.5
    },


    {
      name:"Roséschorle",
      size:"0,4 l",
      price:4.5
    },


    {
      name:"Gerolsteiner still",
      size:"0,5 l",
      price:4.5
    },


    {
      name:"Gerolsteiner medium",
      size:"0,5 l",
      price:4.5
    },


    {
      name:"Traubensaftschorle",
      size:"0,33 l",
      price:3.5
    },


    {
      name:"Pepsi",
      size:"0,33 l",
      price:4
    },


    {
      name:"Pepsi Max",
      size:"0,33 l",
      price:4
    },


    {
      name:"SchwipSchwap Orange",
      size:"0,33 l",
      price:4
    }

  ],



  /* APERITIF */

  aperitif:[


    {
      name:"Aperol Spritz",
      size:"Glas",
      price:7.5
    },


    {
      name:"Hugo",
      size:"Glas",
      price:7.5
    },


    {

      size:"Glas",

    },


    {

    },


    {
      name:"Aperol Spritz alkoholfrei",
      size:"Glas",

    {
      name:"Hugo alkoholfrei",

    },


    {
      name:"Mionetto Aperitivo alkoholfrei",
      size:"Glas",

    },


    {
      name:"Solare Spritz alkoholfrei",

    },


    {
      name:"Gin Tonic",
      size:"Glas",
      price:8.5
    },


    {
      name:"Wodka Lemon",
      size:"Glas",
      price:8.5
    }

  ],



  /* SNACK */

  snack:[

    {
      name:"Brezel",
      size:"1 Stück",
      price:2.5
    }

  ]

};



/* ===============================
   WARENKORB
   =============================== */

let cart = {};

let history = [];



const eur = number =>

  Number(number).toLocaleString(

    "de-DE",

    {

      style:
        "currency",

      currency:
        "EUR"

    }

  );



function keyFor(
  name,
  size
){

  return name + "||" + size;

}



function safeId(text){

  return "q-" +

    btoa(

      unescape(

        encodeURIComponent(
          text
        )

      )

    )

    .replace(
      /[^a-zA-Z0-9]/g,
      ""
    )

    .slice(
      0,
      44
    );

}



/* ===============================
   SEKT UND WEIN ANZEIGEN
   =============================== */

function renderMulti(
  id,
  items
){


  document
    .getElementById(
      id
    )
    .innerHTML =


      `<div class="grid">` +


      items.map(

        item => {


          const full =

            item.opts.length === 3

            ? " full"

            : "";


          return `


            <div class="item${full}">


              <div class="item-name">

                ${item.name}

              </div>


              ${
                item.sub

                ? `
                  <div class="item-sub">
                    ${item.sub}
                  </div>
                `

                : ""
              }


              <div

                class="options"

                style="
                  --cols:
                  ${item.opts.length}
                "
              >


                ${

                  item.opts.map(

                    ([size,price]) => {


                      const key =

                        keyFor(
                          item.name,
                          size
                        );


                      return `


                        <button

                          class="option"

                          id="${safeId(key)}"

                          onclick='

                            add(

                              ${JSON.stringify(
                                item.name +
                                " · " +
                                size
                              )},

                              ${price},

                              ${JSON.stringify(
                                key
                              )}

                            )

                          '
                        >


                          <span class="qty">
                            0
                          </span>


                          <span class="size">
                            ${size}
                          </span>


                          <span class="price">
                            ${eur(price)}
                          </span>


                        </button>


                      `;


                    }

                  ).join("")

                }


              </div>


            </div>


          `;


        }

      ).join("") +


      `</div>`;

}



/* ===============================
   EINZELARTIKEL ANZEIGEN
   =============================== */

function renderSingle(
  id,
  items
){


  document
    .getElementById(
      id
    )
    .innerHTML =


      `<div class="single-grid">` +


      items.map(

        item => {


          const key =

            keyFor(
              item.name,
              item.size
            );


          return `


            <div class="single-card">


              <div class="single-name">

                ${item.name}

              </div>


              <button

                class="option"

                id="${safeId(key)}"

                onclick='

                  add(

                    ${JSON.stringify(
                      item.name +
                      " · " +
                      item.size
                    )},

                    ${item.price},

                    ${JSON.stringify(
                      key
                    )}

                  )

                '
              >


                <span class="qty">
                  0
                </span>


                <span class="size">

                  ${item.size}

                </span>


                <span class="price">

                  ${eur(
                    item.price
                  )}

                </span>


              </button>


            </div>


          `;


        }

      ).join("") +


      `</div>`;

}



/* ===============================
   ALLES AUFBAUEN
   =============================== */

function renderAll(){


  renderMulti(
    "sekt",
    data.sekt
  );


  renderMulti(
    "wein",
    data.wein
  );


  renderSingle(
    "soft",
    data.soft
  );


  renderSingle(
    "aperitif",
    data.aperitif
  );


  renderSingle(
    "snack",
    data.snack
  );

}



/* ===============================
   KATEGORIE WECHSELN
   =============================== */

function showTab(
  id,
  button
){


  document
    .querySelectorAll(
      ".section"
    )
    .forEach(

      section =>

        section
          .classList
          .remove(
            "active"
          )

    );


  document
    .getElementById(
      id
    )
    .classList
    .add(
      "active"
    );


  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(

      tab =>

        tab
          .classList
          .remove(
            "active"
          )

    );


  button
    .classList
    .add(
      "active"
    );


  window.scrollTo({

    top:0,

    behavior:
      "instant"

  });

}



/* ===============================
   VERLAUF
   =============================== */

function snapshot(){


  history.push(

    JSON.stringify(
      cart
    )

  );


  if(
    history.length > 40
  ){

    history.shift();

  }

}



/* ===============================
   ARTIKEL HINZUFÜGEN
   =============================== */

function add(
  name,
  price,
  key
){


  snapshot();


  if(
    !cart[key]
  ){


    cart[key] = {

      name:
        name,

      price:
        price,

      qty:
        0

    };


  }


  cart[key].qty++;


  update();


  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      15
    );

  }

}



/* ===============================
   ZURÜCK
   =============================== */

function undo(){


  if(
    !history.length
  ){

    return;

  }


  cart =

    JSON.parse(

      history.pop()

    );


  update();

}



/* ===============================
   NEUER GAST
   =============================== */

function resetCart(){


  cart = {};

  history = [];


  update();

}



/* ===============================
   SUMME
   =============================== */

function getTotal(){


  let total =
    0;


  for(

    const item

    of Object.values(
      cart
    )

  ){


    total +=

      item.price *
      item.qty;


  }


  return Math.round(
    total * 100
  ) / 100;

}



/* ===============================
   ANZAHL
   =============================== */

function getCount(){


  let count =
    0;


  for(

    const item

    of Object.values(
      cart
    )

  ){


    count +=
      item.qty;


  }


  return count;

}



/* ===============================
   ANZEIGE AKTUALISIEREN
   =============================== */

function update(){


  document
    .querySelectorAll(
      ".option"
    )
    .forEach(

      button => {


        button
          .classList
          .remove(
            "selected"
          );


        const quantity =

          button.querySelector(
            ".qty"
          );


        if(
          quantity
        ){

          quantity.textContent =
            "0";

        }


      }

    );



  for(

    const [
      key,
      item
    ]

    of Object.entries(
      cart
    )

  ){


    if(
      item.qty <= 0
    ){

      continue;

    }


    if(

      key !==
      "pfand-plus"

      &&

      key !==
      "pfand-minus"

    ){


      const button =

        document.getElementById(

          safeId(
            key
          )

        );


      if(
        button
      ){


        button
          .classList
          .add(
            "selected"
          );


        button
          .querySelector(
            ".qty"
          )
          .textContent =
            item.qty;


      }


    }


  }



  document
    .getElementById(
      "count"
    )
    .textContent =

      getCount() +
      " Artikel";



  document
    .getElementById(
      "total"
    )
    .textContent =

      eur(
        getTotal()
      );

}



/* ===============================
   BARZAHLUNG ÖFFNEN
   =============================== */

function openCash(){


  const total =
    getTotal();


  if(
    total <= 0
  ){


    alert(
      "Bitte zuerst Artikel auswählen."
    );


    return;

  }


  document
    .getElementById(
      "cashTotal"
    )
    .textContent =

      eur(
        total
      );


  document
    .getElementById(
      "cashInput"
    )
    .value =
      "";


  document
    .getElementById(
      "change"
    )
    .textContent =

      "0,00 €";


  document
    .getElementById(
      "change"
    )
    .style
    .color =

      "#111";


  createQuickCash(
    total
  );


  cashDialog.showModal();


  setTimeout(

    () => {


      document
        .getElementById(
          "cashInput"
        )
        .focus();


    },

    100

  );

}



/* ===============================
   SCHNELLBETRÄGE
   =============================== */

function createQuickCash(total){


  const standard =

    [
      5,
      10,
      20,
      50,
      100,
      200
    ];


  let buttons =

    standard

      .filter(

        amount =>
          amount >= total

      )

      .slice(
        0,
        4
      );


  if(
    buttons.length < 4
  ){


    buttons =

      standard.slice(
        -4
      );

  }


  document
    .getElementById(
      "quickCash"
    )
    .innerHTML =


      buttons.map(

        amount => `


          <button

            onclick="
              setCash(
                ${amount}
              )
            "
          >

            ${amount} €

          </button>


        `

      ).join("");

}



/* ===============================
   GELD SETZEN
   =============================== */

function setCash(amount){


  document
    .getElementById(
      "cashInput"
    )
    .value =

      amount;


  calculateChange();

}



/* ===============================
   GELDBETRAG LESEN
   =============================== */

function parseCashValue(value){


  return Number(

    String(value)

      .trim()

      .replace(
        /\s/g,
        ""
      )

      .replace(
        ",",
        "."
      )

  ) || 0;

}



/* ===============================
   RÜCKGELD
   =============================== */

function calculateChange(){


  const total =
    getTotal();


  const given =

    parseCashValue(

      document
        .getElementById(
          "cashInput"
        )
        .value

    );


  const difference =

    Math.round(

      (
        given -
        total
      ) * 100

    ) / 100;


  const changeElement =

    document.getElementById(
      "change"
    );


  if(
    difference >= 0
  ){


    changeElement
      .textContent =

        eur(
          difference
        );


    changeElement
      .style
      .color =

        "#17683a";


  }

  else{


    changeElement
      .textContent =

        "Fehlen " +

        eur(

          Math.abs(
            difference
          )

        );


    changeElement
      .style
      .color =

        "#b21f24";


  }

}



/* ===============================
   BEZAHLT
   =============================== */

function finishSale(){


  const total =
    getTotal();


  const given =

    parseCashValue(

      document
        .getElementById(
          "cashInput"
        )
        .value

    );


  if(
    given < total
  ){


    alert(
      "Der Gast hat noch nicht genug gegeben."
    );


    return;

  }


  cashDialog.close();


  resetCart();

}



/* ===============================
   START
   =============================== */

renderAll();

update();

</script>
