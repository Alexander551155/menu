<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
>

<meta name="theme-color" content="#111111">

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<meta
  name="apple-mobile-web-app-title"
  content="Sektstand"
>

<title>Sektstand Rechner</title>

<style>

:root {
  --bg:#f5f1e8;
  --card:#ffffff;
  --ink:#111111;
  --muted:#777;
  --line:#ded9cf;
}

* {
  box-sizing:border-box;
}

html,
body {
  margin:0;
  min-height:100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:var(--bg);
  color:var(--ink);

  -webkit-text-size-adjust:100%;
  touch-action:manipulation;
}

body {
  padding-top:env(safe-area-inset-top);
}

button {
  font:inherit;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}


/* =========================
   KOPF
   ========================= */

header {
  position:sticky;
  top:0;
  z-index:20;

  background:#111;
  color:#fff;

  padding:10px 14px;

  min-height:58px;

  display:flex;
  align-items:center;

  box-shadow:0 2px 10px #0002;
}

.title {
  font-size:23px;
  font-weight:950;
  line-height:1;
}

.hint {
  font-size:12px;
  opacity:.7;
  margin-top:4px;
}


/* =========================
   HAUPTBEREICH
   ========================= */

main {
  max-width:900px;
  margin:0 auto;

  padding:
    10px
    10px
    calc(150px + env(safe-area-inset-bottom));
}


/* =========================
   PFAND
   ========================= */

.pfand {
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;

  margin-bottom:12px;
}

.pfand button {
  border:0;

  border-radius:14px;

  min-height:58px;

  font-weight:950;
  font-size:17px;
}

.pfand .add {
  background:#ffeab1;
}

.pfand .back {
  background:#dff4e5;
}


/* =========================
   KATEGORIEN
   ========================= */

.section-title {
  font-size:22px;
  font-weight:950;

  margin:
    16px
    2px
    8px;
}


/* =========================
   ARTIKEL
   ========================= */

.menu {
  display:grid;

  grid-template-columns:1fr;

  gap:8px;
}

.item {
  background:#fff;

  border:
    1px solid
    var(--line);

  border-radius:15px;

  padding:10px;

  box-shadow:
    0 2px 7px
    #0000000c;
}

.item-name {
  font-size:18px;
  font-weight:900;

  line-height:1.15;

  margin-bottom:8px;
}


/* =========================
   PREISTASTEN
   ========================= */

.options {
  display:grid;

  grid-template-columns:
    repeat(
      var(--cols,1),
      1fr
    );

  gap:7px;
}

.option {
  position:relative;

  border:0;

  border-radius:13px;

  min-height:62px;

  padding:7px 6px;

  background:#ececec;

  color:#111;

  font-weight:950;
}

.option:active {
  transform:scale(.985);
}

.option .size {
  display:block;

  font-size:16px;
}

.option .price {
  display:block;

  margin-top:3px;

  font-size:18px;
}


/* =========================
   QUANTITY / MENGE
   ========================= */

.option .qty {

  display:none;

  position:absolute;

  top:-7px;
  right:-7px;

  min-width:28px;

  height:28px;

  padding:0 7px;

  border-radius:999px;

  align-items:center;
  justify-content:center;

  background:#111;

  color:#fff;

  border:
    2px solid
    #fff;

  font-size:14px;

  font-weight:950;
}

.option.selected .qty {
  display:flex;
}

.option.selected {
  outline:
    3px solid
    #111;

  background:#f7f7f7;
}


/* =========================
   SUMME UNTEN
   ========================= */

.bottom {

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:30;

  background:#fff;

  border-top:
    1px solid
    #d5d5d5;

  box-shadow:
    0 -7px 24px
    #0002;
}

.bottom-inner {

  max-width:900px;

  margin:auto;

  padding:
    9px
    10px
    calc(
      9px +
      env(safe-area-inset-bottom)
    );
}

.sumrow {

  display:flex;

  align-items:center;

  gap:8px;
}

.count {

  background:#111;

  color:#fff;

  border-radius:999px;

  padding:6px 10px;

  font-size:13px;

  font-weight:900;
}

.sumlabel {

  font-size:18px;

  font-weight:900;
}

.total {

  margin-left:auto;

  font-size:34px;

  font-weight:1000;

  letter-spacing:-1px;
}


/* =========================
   UNTEN TASTEN
   ========================= */

.controls {

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;

  margin-top:8px;
}

.controls button {

  border:0;

  border-radius:13px;

  min-height:48px;

  font-weight:950;

  font-size:16px;
}

.undo {

  background:#eee;
}

.reset {

  background:#111;

  color:#fff;
}


/* TABLET */

@media(min-width:700px) {

  .menu {

    grid-template-columns:
      1fr 1fr;

  }

}

</style>
</head>


<body>


<header>

  <div>

    <div class="title">
      🥂 Sektstand
    </div>

    <div class="hint">
      Antippen = Menge +1
    </div>

  </div>

</header>



<main>


<!-- PFAND -->

<div class="pfand">

  <button
    class="add"
    onclick="
      add(
        'Pfand',
        3,
        'pfand-plus'
      )
    "
  >

    + 3 € Pfand

  </button>


  <button
    class="back"
    onclick="
      add(
        'Pfandrückgabe',
        -3,
        'pfand-minus'
      )
    "
  >

    − 3 € Rückgabe

  </button>

</div>



<!-- HIER WIRD DAS MENÜ EINGEFÜGT -->

<div id="app"></div>


</main>



<!-- SUMME UNTEN -->

<div class="bottom">

  <div class="bottom-inner">


    <div class="sumrow">


      <span
        class="count"
        id="count"
      >

        0 Artikel

      </span>


      <span class="sumlabel">

        Summe

      </span>


      <span
        class="total"
        id="total"
      >

        0,00 €

      </span>


    </div>



    <div class="controls">


      <button
        class="undo"
        onclick="undo()"
      >

        ↶ Rückgängig

      </button>


      <button
        class="reset"
        onclick="resetCart()"
      >

        NEUER GAST

      </button>


    </div>


  </div>

</div>



<script>

/* =========================================
   MENÜ
   ========================================= */

const sections = [


/* =====================
   SEKT
   ===================== */

{

  title:"🥂 Sekt",

  items:[


    {

      name:
        "Fürst von Metternich Riesling",

      opts:[

        ["0,1 l",5],

        ["0,75 l",28]

      ]

    },


    {

      name:
        "Fürst von Metternich Rosé",

      opts:[

        ["0,1 l",5],

        ["0,75 l",28]

      ]

    },


    {

      name:
        "Fürst von Metternich Chardonnay",

      opts:[

        ["0,1 l",5],

        ["0,75 l",28]

      ]

    }


  ]

},



/* =====================
   WEIN
   ===================== */

{

  title:"🍷 Wein",

  items:[


    {

      name:
        "Nr. 1 Riesling „Hofgut Laubenheimer Höhe“, trocken",

      opts:[

        ["0,1 l",4],

        ["0,2 l",7],

        ["0,75 l",24.5]

      ]

    },


    {

      name:
        "Nr. 2 Riesling Gelblack, trocken",

      opts:[

        ["0,1 l",4.5],

        ["0,2 l",8],

        ["0,75 l",28]

      ]

    },


    {

      name:
        "Nr. 3 Riesling Gelblack, feinherb",

      opts:[

        ["0,1 l",4.5],

        ["0,2 l",8],

        ["0,75 l",28]

      ]

    },


    {

      name:
        "Nr. 4 Weißburgunder, trocken",

      opts:[

        ["0,1 l",4.5],

        ["0,2 l",8],

        ["0,75 l",28]

      ]

    },


    {

      name:
        "Nr. 5 Grauburgunder Réserve, trocken",

      opts:[

        ["0,1 l",3.5],

        ["0,2 l",6.5],

        ["0,75 l",22]

      ]

    },


    {

      name:
        "Nr. 6 Chardonnay, trocken",

      opts:[

        ["0,1 l",3.5],

        ["0,2 l",6.5],

        ["0,75 l",22]

      ]

    },


    {

      name:
        "Nr. 7 Rosé „HASE“, trocken",

      opts:[

        ["0,1 l",3.5],

        ["0,2 l",6.5],

        ["0,75 l",22]

      ]

    }


  ]

},



/* =====================
   SCHORLE / WASSER
   ===================== */

{

  title:"🥤 Schorle & alkoholfrei",

  items:[


    {

      name:"Weinschorle",

      opts:[
        ["0,4 l",4.5]
      ]

    },


    {

      name:"Roséschorle",

      opts:[
        ["0,4 l",4.5]
      ]

    },


    {

      name:"Gerolsteiner still",

      opts:[
        ["0,5 l",4.5]
      ]

    },


    {

      name:"Gerolsteiner medium",

      opts:[
        ["0,5 l",4.5]
      ]

    },


    {

      name:"Traubensaftschorle",

      opts:[
        ["0,33 l",3.5]
      ]

    },


    {

      name:"Pepsi",

      opts:[
        ["0,33 l",4]
      ]

    },


    {

      name:"Pepsi Max",

      opts:[
        ["0,33 l",4]
      ]

    },


    {

      name:"SchwipSchwap Orange",

      opts:[
        ["0,33 l",4]
      ]

    }


  ]

},



/* =====================
   APERITIF
   ===================== */

{

  title:"🍹 Aperitif & Longdrinks",

  items:[


    {

      name:"Aperol Spritz",

      opts:[
        ["Glas",7.5]
      ]

    },


    {

      name:"Hugo",

      opts:[
        ["Glas",7.5]
      ]

    },


    {

      name:"Mionetto Aperitivo",

      opts:[
        ["Glas",7.5]
      ]

    },


    {

      name:"Solare Spritz",

      opts:[
        ["Glas",7.5]
      ]

    },


    {

      name:
        "Aperol Spritz alkoholfrei",

      opts:[
        ["Glas",7.5]
      ]

    },


    {

      name:
        "Hugo alkoholfrei",

      opts:[
        ["Glas",7.5]
      ]

    },


    {

      name:
        "Mionetto Aperitivo alkoholfrei",

      opts:[
        ["Glas",7.5]
      ]

    },


    {

      name:
        "Solare Spritz alkoholfrei",

      opts:[
        ["Glas",7.5]
      ]

    },


    {

      name:"Gin Tonic",

      opts:[
        ["Glas",8.5]
      ]

    },


    {

      name:"Wodka Lemon",

      opts:[
        ["Glas",8.5]
      ]

    }


  ]

},



/* =====================
   SNACK
   ===================== */

{

  title:"🥨 Snack",

  items:[


    {

      name:"Brezel",

      opts:[
        ["1 Stück",2.5]
      ]

    }


  ]

}


];



/* =========================================
   WARENKORB
   ========================================= */

let cart = {};

let history = [];



/* EURO */

const eur = number =>

  Number(number).toLocaleString(

    "de-DE",

    {

      style:"currency",

      currency:"EUR"

    }

  );



/* SCHLÜSSEL */

function keyFor(
  name,
  size
) {

  return name + "||" + size;

}



/* HTML ID ERSTELLEN */

function safeId(text) {

  return "q-" +

    btoa(

      unescape(

        encodeURIComponent(text)

      )

    )

    .replace(

      /[^a-zA-Z0-9]/g,

      ""

    )

    .slice(0,40);

}



/* =========================================
   MENÜ ANZEIGEN
   ========================================= */

function renderMenu() {


  const root =

    document.getElementById(
      "app"
    );


  root.innerHTML =

    sections.map(

      section => `


      <section>


        <div class="section-title">

          ${section.title}

        </div>


        <div class="menu">


          ${

            section.items.map(

              item => `


              <div class="item">


                <div class="item-name">

                  ${item.name}

                </div>


                <div
                  class="options"

                  style="
                    --cols:
                    ${Math.min(
                      item.opts.length,
                      3
                    )}
                  "
                >


                ${

                  item.opts.map(

                    ([size,price]) => {


                      const key =

                        keyFor(
                          item.name,
                          size
                        );


                      const id =

                        safeId(key);


                      return `


                      <button

                        class="option"

                        id="${id}"

                        onclick='

                          add(

                            ${JSON.stringify(
                              item.name +
                              " · " +
                              size
                            )},

                            ${price},

                            ${JSON.stringify(
                              key
                            )}

                          )

                        '
                      >


                        <span class="qty">

                          0

                        </span>


                        <span class="size">

                          ${size}

                        </span>


                        <span class="price">

                          ${eur(price)}

                        </span>


                      </button>


                      `;


                    }

                  ).join("")

                }


                </div>


              </div>


              `

            ).join("")

          }


        </div>


      </section>


      `

    ).join("");

}



/* =========================================
   VERLAUF SPEICHERN
   ========================================= */

function snapshot() {


  history.push(

    JSON.stringify(cart)

  );


  if (
    history.length > 30
  ) {

    history.shift();

  }

}



/* =========================================
   ARTIKEL HINZUFÜGEN
   ========================================= */

function add(
  name,
  price,
  key
) {


  snapshot();


  if (
    !cart[key]
  ) {


    cart[key] = {

      name:name,

      price:price,

      qty:0

    };


  }


  cart[key].qty++;


  update();


  if (
    navigator.vibrate
  ) {

    navigator.vibrate(15);

  }

}



/* =========================================
   RÜCKGÄNGIG
   ========================================= */

function undo() {


  if (
    !history.length
  ) {

    return;

  }


  cart = JSON.parse(

    history.pop()

  );


  update();

}



/* =========================================
   NEUER GAST
   ========================================= */

function resetCart() {


  if (
    Object.keys(cart).length === 0
  ) {

    return;

  }


  snapshot();


  cart = {};


  update();

}



/* =========================================
   SUMME + QUANTITY AKTUALISIEREN
   ========================================= */

function update() {


  let count = 0;

  let total = 0;



  /* ALLE QUANTITY MARKIERUNGEN ZURÜCKSETZEN */


  document

    .querySelectorAll(
      ".option"
    )

    .forEach(

      button => {


        button.classList.remove(
          "selected"
        );


        const quantity =

          button.querySelector(
            ".qty"
          );


        if (
          quantity
        ) {

          quantity.textContent =
            "0";

        }


      }

    );



  /* WARENKORB DURCHGEHEN */


  for (

    const [
      key,
      item
    ]

    of Object.entries(cart)

  ) {


    if (
      item.qty <= 0
    ) {

      continue;

    }


    count +=
      item.qty;


    total +=

      item.qty *
      item.price;



    /* QUANTITY AM ARTIKEL ZEIGEN */


    if (

      key !==
      "pfand-plus"

      &&

      key !==
      "pfand-minus"

    ) {


      const button =

        document.getElementById(

          safeId(key)

        );


      if (
        button
      ) {


        button.classList.add(
          "selected"
        );


        button
          .querySelector(
            ".qty"
          )
          .textContent =
            item.qty;


      }


    }


  }



  /* ARTIKELANZAHL */


  document
    .getElementById(
      "count"
    )
    .textContent =

      count +
      " Artikel";



  /* GESAMTSUMME */


  document
    .getElementById(
      "total"
    )
    .textContent =

      eur(

        Math.round(
          total * 100
        ) / 100

      );

}



/* =========================================
   START
   ========================================= */

renderMenu();

update();

</script>


</body>
</html>
