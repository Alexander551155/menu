<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
>

<meta name="theme-color" content="#111111">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sektstand">

<meta name="mobile-web-app-capable" content="yes">

<title>Sektstand Rechner</title>

<style>

:root{
  --bg:#f5f1e8;
  --card:#fff;
  --ink:#111;
  --muted:#777;
  --line:#ded9cf;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:var(--bg);
  color:var(--ink);

  -webkit-text-size-adjust:100%;
  touch-action:manipulation;
}

body{
  padding-top:env(safe-area-inset-top);
}

button,
input{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}


/* =========================
   KOPF
   ========================= */

header{
  position:sticky;
  top:0;
  z-index:20;

  background:#111;
  color:#fff;

  padding:10px 14px;

  min-height:58px;

  display:flex;
  align-items:center;

  box-shadow:0 2px 10px #0002;
}

.title{
  font-size:23px;
  font-weight:950;
  line-height:1;
}

.hint{
  font-size:12px;
  opacity:.7;
  margin-top:4px;
}


/* =========================
   HAUPTBEREICH
   ========================= */

main{
  max-width:900px;
  margin:0 auto;

  padding:
    10px
    10px
    calc(
      190px +
      env(safe-area-inset-bottom)
    );
}


/* =========================
   PFAND
   ========================= */

.pfand{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.pfand button{
  border:0;
  border-radius:14px;
  min-height:58px;
  font-weight:950;
  font-size:17px;
}

.pfand .add{
  background:#ffeab1;
}

.pfand .back{
  background:#dff4e5;
}


/* =========================
   KATEGORIEN
   ========================= */

.section-title{
  font-size:22px;
  font-weight:950;
  margin:16px 2px 8px;
}


/* =========================
   ARTIKEL
   ========================= */

.menu{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
}

.item{
  background:#fff;

  border:
    1px solid
    var(--line);

  border-radius:15px;

  padding:10px;

  box-shadow:
    0 2px 7px
    #0000000c;
}

.item-name{
  font-size:18px;
  font-weight:900;
  line-height:1.15;
  margin-bottom:8px;
}


/* =========================
   PREISTASTEN
   ========================= */

.options{
  display:grid;

  grid-template-columns:
    repeat(
      var(--cols,1),
      1fr
    );

  gap:7px;
}

.option{
  position:relative;

  border:0;
  border-radius:13px;

  min-height:62px;

  padding:7px 6px;

  background:#ececec;
  color:#111;

  font-weight:950;
}

.option:active{
  transform:scale(.985);
}

.option .size{
  display:block;
  font-size:16px;
}

.option .price{
  display:block;
  margin-top:3px;
  font-size:18px;
}


/* =========================
   MENGE
   ========================= */

.option .qty{
  display:none;

  position:absolute;

  top:-7px;
  right:-7px;

  min-width:28px;
  height:28px;

  padding:0 7px;

  border-radius:999px;

  align-items:center;
  justify-content:center;

  background:#111;
  color:#fff;

  border:2px solid #fff;

  font-size:14px;
  font-weight:950;
}

.option.selected .qty{
  display:flex;
}

.option.selected{
  outline:3px solid #111;
  background:#f7f7f7;
}


/* =========================
   SUMME UNTEN
   ========================= */

.bottom{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:30;

  background:#fff;

  border-top:
    1px solid
    #d5d5d5;

  box-shadow:
    0 -7px 24px
    #0002;
}

.bottom-inner{
  max-width:900px;
  margin:auto;

  padding:
    9px
    10px
    calc(
      9px +
      env(safe-area-inset-bottom)
    );
}

.sumrow{
  display:flex;
  align-items:center;
  gap:8px;
}

.count{
  background:#111;
  color:#fff;

  border-radius:999px;

  padding:6px 10px;

  font-size:13px;
  font-weight:900;
}

.sumlabel{
  font-size:18px;
  font-weight:900;
}

.total{
  margin-left:auto;

  font-size:34px;
  font-weight:1000;

  letter-spacing:-1px;
}


/* =========================
   UNTEN BUTTONS
   ========================= */

.controls{
  display:grid;

  grid-template-columns:
    1fr 1fr 1fr;

  gap:7px;

  margin-top:8px;
}

.controls button{
  border:0;

  border-radius:13px;

  min-height:50px;

  font-weight:950;

  font-size:14px;
}

.undo{
  background:#eee;
}

.cash{
  background:#16a34a;
  color:#fff;
}

.reset{
  background:#111;
  color:#fff;
}


/* =========================
   BARZAHLUNG
   ========================= */

dialog{
  border:0;
  padding:0;

  border-radius:20px;

  width:
    min(
      520px,
      calc(100% - 24px)
    );

  box-shadow:
    0 25px 80px
    #0007;
}

dialog::backdrop{
  background:#0009;
}

.modal{
  padding:18px;
}

.modal h2{
  margin:0 0 12px;
  font-size:25px;
}

.to-pay-label{
  font-size:15px;
  color:#666;
}

.to-pay{
  font-size:38px;
  font-weight:1000;
  margin-top:2px;
}


/* SCHNELLBETRÄGE */

.quick-cash{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:7px;

  margin:
    14px
    0
    10px;
}

.quick-cash button{
  min-height:52px;

  border:0;

  border-radius:12px;

  background:#eee;

  font-weight:950;
}


/* GAST GIBT */

.cash-label{
  display:block;

  font-size:14px;
  font-weight:800;

  margin-bottom:5px;
}

#cashInput{
  width:100%;

  padding:13px;

  border:
    2px solid
    #aaa;

  border-radius:12px;

  font-size:28px;
  font-weight:900;

  outline:none;
}

#cashInput:focus{
  border-color:#111;
}


/* RÜCKGELD */

.change-box{
  margin-top:12px;

  background:#f1f1f1;

  border-radius:14px;

  padding:12px;
}

.change-label{
  font-size:14px;
  color:#666;
}

.change{
  font-size:36px;
  font-weight:1000;
  margin-top:2px;
}


/* BARZAHLUNG BUTTONS */

.modal-buttons{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;

  margin-top:14px;
}

.modal-buttons button{
  min-height:54px;

  border:0;

  border-radius:13px;

  font-weight:950;

  font-size:16px;
}

.cancel{
  background:#eee;
}

.paid{
  background:#111;
  color:#fff;
}


/* TABLET */

@media(min-width:700px){

  .menu{
    grid-template-columns:
      1fr 1fr;
  }

}

</style>
</head>


<body>


<header>

  <div>

    <div class="title">
      🥂 Sektstand
    </div>

    <div class="hint">
      Antippen = Menge +1
    </div>

  </div>

</header>



<main>


<!-- PFAND -->

<div class="pfand">

  <button
    class="add"
    onclick="
      add(
        'Pfand',
        3,
        'pfand-plus'
      )
    "
  >

    + 3 € Pfand

  </button>


  <button
    class="back"
    onclick="
      add(
        'Pfandrückgabe',
        -3,
        'pfand-minus'
      )
    "
  >

    − 3 € Rückgabe

  </button>

</div>



<div id="app"></div>


</main>



<!-- =========================
     SUMME UNTEN
     ========================= -->

<div class="bottom">

  <div class="bottom-inner">


    <div class="sumrow">


      <span
        class="count"
        id="count"
      >

        0 Artikel

      </span>


      <span class="sumlabel">
        Summe
      </span>


      <span
        class="total"
        id="total"
      >

        0,00 €

      </span>


    </div>



    <div class="controls">


      <button
        class="undo"
        onclick="undo()"
      >

        ↶ Zurück

      </button>


      <button
        class="cash"
        onclick="openCash()"
      >

        💶 BAR

      </button>


      <button
        class="reset"
        onclick="resetCart()"
      >

        NEUER GAST

      </button>


    </div>


  </div>

</div>



<!-- =========================
     BARZAHLUNG
     ========================= -->

<dialog id="cashDialog">

  <div class="modal">


    <h2>
      💶 Barzahlung
    </h2>


    <div class="to-pay-label">
      Gast muss zahlen
    </div>


    <div
      class="to-pay"
      id="cashTotal"
    >

      0,00 €

    </div>



    <div
      class="quick-cash"
      id="quickCash"
    >
    </div>



    <label
      class="cash-label"
      for="cashInput"
    >

      Gast gibt:

    </label>


    <input
      id="cashInput"
      type="text"
      inputmode="decimal"
      autocomplete="off"
      placeholder="z. B. 20"
      oninput="calculateChange()"
    >



    <div class="change-box">

      <div class="change-label">
        Rückgeld
      </div>


      <div
        class="change"
        id="change"
      >

        0,00 €

      </div>

    </div>



    <div class="modal-buttons">


      <button
        class="cancel"
        onclick="cashDialog.close()"
      >

        Abbrechen

      </button>


      <button
        class="paid"
        onclick="finishSale()"
      >

        BEZAHLT / NEUER GAST

      </button>


    </div>


  </div>

</dialog>



<script>

/* =========================================

const sections = [

{

/* =========================================
   WARENKORB
   ========================================= */

let cart = {};

let history = [];



/* EURO */

const eur = number =>

  Number(number).toLocaleString(

    "de-DE",

    {

      style:
        "currency",

      currency:
        "EUR"

    }

  );



/* =========================================
   SCHLÜSSEL
   ========================================= */

function keyFor(
  name,
  size
){

  return name + "||" + size;

}



/* =========================================
   HTML ID
   ========================================= */

function safeId(text){

  return "q-" +

    btoa(

      unescape(

        encodeURIComponent(
          text
        )

      )

    )

    .replace(
      /[^a-zA-Z0-9]/g,
      ""
    )

    .slice(
      0,
      40
    );

}



/* =========================================
   MENÜ ANZEIGEN
   ========================================= */

function renderMenu(){


  const root =

    document.getElementById(
      "app"
    );


  root.innerHTML =

    sections.map(

      section => `


        <section>


          <div class="section-title">

            ${section.title}

          </div>


          <div class="menu">


            ${

              section.items.map(

                item => `


                  <div class="item">


                    <div class="item-name">

                      ${item.name}

                    </div>


                    <div

                      class="options"

                      style="
                        --cols:
                        ${Math.min(
                          item.opts.length,
                          3
                        )}
                      "
                    >


                    ${

                      item.opts.map(

                        ([size,price]) => {


                          const key =

                            keyFor(
                              item.name,
                              size
                            );


                          const id =

                            safeId(
                              key
                            );


                          return `


                            <button

                              class="option"

                              id="${id}"

                              onclick='

                                add(

                                  ${JSON.stringify(
                                    item.name +
                                    " · " +
                                    size
                                  )},

                                  ${price},

                                  ${JSON.stringify(
                                    key
                                  )}

                                )

                              '
                            >


                              <span class="qty">
                                0
                              </span>


                              <span class="size">
                                ${size}
                              </span>


                              <span class="price">
                                ${eur(price)}
                              </span>


                            </button>


                          `;


                        }

                      ).join("")

                    }


                    </div>


                  </div>


                `

              ).join("")

            }


          </div>


        </section>


      `

    ).join("");

}



/* =========================================
   VERLAUF
   ========================================= */

function snapshot(){


  history.push(

    JSON.stringify(
      cart
    )

  );


  if(
    history.length > 40
  ){

    history.shift();

  }

}



/* =========================================
   ARTIKEL HINZUFÜGEN
   ========================================= */

function add(
  name,
  price,
  key
){


  snapshot();


  if(
    !cart[key]
  ){


    cart[key] = {

      name:name,

      price:price,

      qty:0

    };


  }


  cart[key].qty++;


  update();


  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      15
    );

  }

}



/* =========================================
   ZURÜCK
   ========================================= */

function undo(){


  if(
    !history.length
  ){

    return;

  }


  cart =

    JSON.parse(

      history.pop()

    );


  update();

}



/* =========================================
   NEUER GAST
   ========================================= */

function resetCart(){


  cart = {};

  history = [];

  update();

}



/* =========================================
   SUMME
   ========================================= */

function getTotal(){


  let total =
    0;


  for(

    const item

    of Object.values(
      cart
    )

  ){


    total +=

      item.price *
      item.qty;


  }


  return Math.round(
    total * 100
  ) / 100;

}



/* =========================================
   ANZAHL
   ========================================= */

function getCount(){


  let count =
    0;


  for(

    const item

    of Object.values(
      cart
    )

  ){


    count +=
      item.qty;


  }


  return count;

}



/* =========================================
   ANZEIGE
   ========================================= */

function update(){


  document

    .querySelectorAll(
      ".option"
    )

    .forEach(

      button => {


        button
          .classList
          .remove(
            "selected"
          );


        const quantity =

          button.querySelector(
            ".qty"
          );


        if(
          quantity
        ){

          quantity.textContent =
            "0";

        }


      }

    );



  for(

    const [
      key,
      item
    ]

    of Object.entries(
      cart
    )

  ){


    if(
      item.qty <= 0
    ){

      continue;

    }


    if(

      key !==
      "pfand-plus"

      &&

      key !==
      "pfand-minus"

    ){


      const button =

        document.getElementById(

          safeId(
            key
          )

        );


      if(
        button
      ){


        button
          .classList
          .add(
            "selected"
          );


        button
          .querySelector(
            ".qty"
          )
          .textContent =
            item.qty;


      }


    }


  }



  document

    .getElementById(
      "count"
    )

    .textContent =

      getCount() +
      " Artikel";



  document

    .getElementById(
      "total"
    )

    .textContent =

      eur(
        getTotal()
      );

}



/* =========================================
   BARZAHLUNG ÖFFNEN
   ========================================= */

function openCash(){


  const total =
    getTotal();


  if(
    total <= 0
  ){


    alert(
      "Bitte zuerst Artikel auswählen."
    );


    return;

  }


  document

    .getElementById(
      "cashTotal"
    )

    .textContent =

      eur(
        total
      );


  document

    .getElementById(
      "cashInput"
    )

    .value =
      "";


  const change =

    document.getElementById(
      "change"
    );


  change.textContent =
    "0,00 €";


  change.style.color =
    "#111";


  createQuickCash(
    total
  );


  cashDialog.showModal();


  setTimeout(

    () => {


      document

        .getElementById(
          "cashInput"
        )

        .focus();


    },

    100

  );

}



/* =========================================
   SCHNELLBETRÄGE
   ========================================= */

function createQuickCash(total){


  const standard =

    [
      5,
      10,
      20,
      50,
      100,
      200
    ];


  let buttons =

    standard

      .filter(

        amount =>
          amount >= total

      )

      .slice(
        0,
        4
      );


  if(
    buttons.length < 4
  ){


    buttons =

      standard.slice(
        -4
      );

  }


  document

    .getElementById(
      "quickCash"
    )

    .innerHTML =

      buttons.map(

        amount => `


          <button

            onclick="
              setCash(
                ${amount}
              )
            "
          >

            ${amount} €

          </button>


        `

      ).join("");

}



/* =========================================
   SCHNELLBETRAG SETZEN
   ========================================= */

function setCash(amount){


  document

    .getElementById(
      "cashInput"
    )

    .value =
      amount;


  calculateChange();

}



/* =========================================
   DEZIMALZAHL LESEN
   ========================================= */

function parseCashValue(value){


  return Number(

    String(value)

      .trim()

      .replace(
        /\s/g,
        ""
      )

      .replace(
        ",",
        "."
      )

  ) || 0;

}



/* =========================================
   RÜCKGELD
   ========================================= */

function calculateChange(){


  const total =
    getTotal();


  const given =

    parseCashValue(

      document

        .getElementById(
          "cashInput"
        )

        .value

    );


  const difference =

    Math.round(

      (
        given -
        total
      ) * 100

    ) / 100;


  const changeElement =

    document.getElementById(
      "change"
    );


  if(
    difference >= 0
  ){


    changeElement
      .textContent =

        eur(
          difference
        );


    changeElement
      .style
      .color =

        "#17683a";


  }

  else{


    changeElement
      .textContent =

        "Fehlen " +

        eur(

          Math.abs(
            difference
          )

        );


    changeElement
      .style
      .color =

        "#b21f24";


  }

}



/* =========================================
   BEZAHLT
   ========================================= */

function finishSale(){


  const total =
    getTotal();


  const given =

    parseCashValue(

      document

        .getElementById(
          "cashInput"
        )

        .value

    );


  if(
    given < total
  ){


    alert(
      "Der Gast hat noch nicht genug gegeben."
    );


    return;

  }


  cashDialog.close();


  resetCart();

}



/* =========================================
   START
   ========================================= */

renderMenu();

update();

</script>
