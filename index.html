>

<meta name="theme-color" content="#1a1510">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"

<style>

/* ========================================
   FARBEN
   ======================================== */

:root{

  --bg:#f4efe5;

  --card:#fffdf8;

  --ink:#17130f;

  --muted:#756b5e;

  --line:#ddd2c1;

  --gold:#c8a55e;

  --gold-dark:#a8843f;

  --dark:#1a1510;

  --dark2:#2a2118;

  --green:#167540;

}


/* ========================================
   GRUNDLAGE
   ======================================== */

*{
  box-sizing:border-box;
}


html,
body{

  margin:0;

  min-height:100%;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:var(--bg);

  color:var(--ink);

  -webkit-text-size-adjust:100%;

  touch-action:manipulation;

}


body{

  padding-top:
    env(safe-area-inset-top);

}


button,
input{

  font:inherit;

}


button{

  -webkit-tap-highlight-color:
    transparent;

  touch-action:
    manipulation;

}



/* ========================================
   KOPF
   ======================================== */

header{

  position:sticky;

  top:0;

  z-index:40;

  background:
    linear-gradient(
      135deg,
      #16120d,
      #2b2218
    );

  color:#fff;

  padding:
    9px
    10px
    8px;

  border-bottom:
    2px solid
    var(--gold);

  box-shadow:
    0 3px 14px
    #0005;

}


.headrow{

  display:flex;

  align-items:center;

  justify-content:
    space-between;

  gap:10px;

}


.brand-small{

  font-size:9px;

  font-weight:850;

  letter-spacing:
    1.5px;

  color:#d9c18d;

  margin-bottom:3px;

}


.title{

  font-size:21px;

  font-weight:950;

  line-height:1;

  color:#fff;

}


.subtitle{

  font-size:12px;

  font-weight:700;

  color:#d8c7a8;

  margin-top:3px;

}


/* ========================================
   PFAND OBEN
   ======================================== */

.pfand-mini{

  display:flex;

  gap:6px;

}


.pfand-mini button{

  border:
    1px solid
    #ffffff22;

  border-radius:11px;

  min-height:40px;

  padding:
    0
    11px;

  font-weight:950;

  font-size:13px;

  box-shadow:
    inset 0 1px 0
    #ffffff44;

}


.pfand-plus{

  background:
    linear-gradient(
      180deg,
      #f5dd94,
      #d5b153
    );

  color:#21180c;

}


.pfand-minus{

  background:
    linear-gradient(
      180deg,
      #e5f4e6,
      #c4dfc8
    );

  color:#16371e;

}



/* ========================================
   KATEGORIEN
   ======================================== */

.tabs{

  position:sticky;

  top:70px;

  z-index:35;

  display:grid;

  grid-template-columns:
    repeat(
      5,
      1fr
    );

  gap:5px;

  padding:
    6px
    6px
    7px;

  background:
    #f4efe5ef;

  backdrop-filter:
    blur(10px);

  border-bottom:
    1px solid
    #d8cdbd;

}


.tab{

  border:
    1px solid
    #e0d7ca;

  border-radius:11px;

  min-height:42px;

  background:#fff;

  color:#1680d8;

  font-size:12px;

  font-weight:900;

  padding:
    4px
    2px;

}


.tab.active{

  background:
    linear-gradient(
      180deg,
      #272017,
      #17130f
    );

  color:#fff;

  border:
    2px solid
    var(--gold);

}



/* ========================================
   HAUPTBEREICH
   ======================================== */

main{

  max-width:760px;

  margin:
    0 auto;

  padding:

    6px

    7px

    calc(
      132px +
      env(safe-area-inset-bottom)
    );

}


.section{

  display:none;

}


.section.active{

  display:block;

}



/* ========================================
   SEKT / WEIN KARTEN
   ======================================== */

.grid{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:6px;

}


.item{

  background:
    var(--card);

  border:
    1px solid
    var(--line);

  border-radius:13px;

  padding:7px;

  box-shadow:

    0 2px 6px
    #00000010;

}


.item.full{

  grid-column:
    1/-1;

}


.item-name{

  font-size:14px;

  font-weight:950;

  line-height:1.08;

  margin-bottom:6px;

  min-height:30px;

}


.item-sub{

  font-size:10px;

  color:var(--muted);

  line-height:1.1;

  margin-top:-2px;

  margin-bottom:5px;

}



/* ========================================
   PREIS BUTTONS
   ======================================== */

.options{

  display:grid;

  grid-template-columns:

    repeat(
      var(--cols,1),
      1fr
    );

  gap:5px;

}


.option{

  position:relative;

  border:
    1px solid
    #e3ddd4;

  border-radius:10px;

  min-height:49px;

  padding:
    5px
    3px;

  background:
    linear-gradient(
      180deg,
      #f0eeee,
      #e8e6e3
    );

  color:#111;

  font-weight:950;

}


.option:active{

  transform:
    scale(.985);

}


.option .size{

  display:block;

  font-size:12px;

}


.option .price{

  display:block;

  font-size:16px;

  margin-top:2px;

}



/* ========================================
   MENGEN BADGE
   ======================================== */

.option .qty{

  display:none;

  position:absolute;

  top:-7px;

  right:-7px;

  min-width:25px;

  height:25px;

  padding:
    0
    6px;

  border-radius:
    999px;

  align-items:center;

  justify-content:center;

  background:
    #111;

  color:#fff;

  border:
    2px solid
    #fff;

  font-size:12px;

  font-weight:950;

}


.option.selected{

  outline:
    3px solid
    var(--dark);

  background:
    #fff8e8;

}


.option.selected .qty{

  display:flex;

}



/* ========================================
   SOFT / APERITIF / SNACK
   ======================================== */

.single-grid{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:6px;

}


.single-card{

  background:#fffdf8;

  border:
    1px solid
    var(--line);

  border-radius:12px;

  padding:7px;

}


.single-name{

  font-size:13px;

  font-weight:950;

  line-height:1.05;

  min-height:30px;

}


.single-card .option{

  width:100%;

  margin-top:5px;

}



/* ========================================
   UNTERE SUMMENLEISTE
   ======================================== */

.bottom{

  position:fixed;

  left:0;

  right:0;

  bottom:0;

  z-index:50;

  background:
    #fffdf8;

  border-top:
    2px solid
    var(--gold);

  box-shadow:
    0 -8px 25px
    #0002;

}


.bottom-inner{

  max-width:760px;

  margin:auto;

  padding:

    7px

    8px

    calc(
      7px +
      env(safe-area-inset-bottom)
    );

}


.sumrow{

  display:flex;

  align-items:center;

  gap:7px;

}


.count{

  background:
    #17130f;

  color:#fff;

  border-radius:
    999px;

  padding:
    5px
    8px;

  font-size:11px;

  font-weight:900;

}


.sumlabel{

  font-size:16px;

  font-weight:900;

}


.total{

  margin-left:auto;

  font-size:30px;

  font-weight:1000;

  letter-spacing:
    -1px;

}



/* ========================================
   BUTTONS UNTEN
   ======================================== */

.controls{

  display:grid;

  grid-template-columns:

    .85fr

    1fr

    1fr;

  gap:6px;

  margin-top:6px;

}


.controls button{

  border:0;

  border-radius:11px;

  min-height:44px;

  font-weight:950;

  font-size:13px;

}


.undo{

  background:
    #ece9e4;

}


.cash{

  background:

    linear-gradient(
      180deg,
      #218d50,
      #146837
    );

  color:#fff;

}


.reset{

  background:

    linear-gradient(
      180deg,
      #2a231c,
      #111
    );

  color:#fff;

}



/* ========================================
   BARZAHLUNGSFENSTER
   ======================================== */

dialog{

  border:0;

  padding:0;

  border-radius:18px;

  width:

    min(
      480px,
      calc(
        100% - 20px
      )
    );

  box-shadow:

    0 25px 80px
    #0007;

}


dialog::backdrop{

  background:
    #0009;

}


.modal{

  padding:16px;

  background:
    #fffdf8;

}


.modal h2{

  margin:
    0
    0
    8px;

  font-size:23px;

}


.to-pay-label{

  font-size:13px;

  color:#666;

}


.to-pay{

  font-size:36px;

  font-weight:1000;

}



/* ========================================
   SCHNELL GELD BUTTONS
   ======================================== */

.quick-cash{

  display:grid;

  grid-template-columns:
    repeat(
      4,
      1fr
    );

  gap:6px;

  margin:

    12px

    0

    10px;

}


.quick-cash button{

  min-height:48px;

  border:
    1px solid
    #ddd5c8;

  border-radius:10px;

  background:
    #f1ede5;

  font-weight:950;

}



/* ========================================
   GAST GIBT
   ======================================== */

.cash-label{

  display:block;

  font-size:13px;

  font-weight:800;

  margin-bottom:4px;

}


#cashInput{

  width:100%;

  padding:11px;

  border:
    2px solid
    #aaa;

  border-radius:11px;

  font-size:26px;

  font-weight:900;

  outline:none;

  background:#fff;

}


#cashInput:focus{

  border-color:
    var(--gold-dark);

}



/* ========================================
   RÜCKGELD
   ======================================== */

.change-box{

  margin-top:10px;

  background:
    #f2eee7;

  border:
    1px solid
    #e1d8cb;

  border-radius:12px;

  padding:10px;

}


.change-label{

  font-size:13px;

  color:#666;

}


.change{

  font-size:34px;

  font-weight:1000;

}



/* ========================================
   MODAL BUTTONS
   ======================================== */

.modal-buttons{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:7px;

  margin-top:12px;

}


.modal-buttons button{

  min-height:50px;

  border:0;

  border-radius:11px;

  font-weight:950;

  font-size:14px;

}


.cancel{

  background:
    #ece9e4;

}


.paid{

  background:
    linear-gradient(
      180deg,
      #2a231c,
      #111
    );

  color:#fff;

}

   KLEINE HANDYS
   ======================================== */

@media(
  max-width:380px

  .brand-small{

    font-size:8px;

  }

    font-size:18px;

  }

    font-size:10px;

  }


  .pfand-mini button{

    padding:
      0
      8px;

    font-size:12px;

  }


  .tabs{

    top:68px;

  }


  .tab{

    font-size:11px;

  }


  .item-name{

    font-size:13px;

  }


  .option .price{

    font-size:15px;

  }

}

</style>

    🍹 Aperitif

  </button>

    🥨 Snack

<!-- ========================================

     ======================================== -->

<main>

  ></section>



  <section

    id="soft"

    class="section"

  ></section>



  <section

    id="aperitif"

    class="section"

  ></section>



  <section

    id="snack"

    class="section"

  ></section>


</main>



<!-- ========================================
     SUMME UNTEN
     ======================================== -->

<div class="bottom">


  <div class="bottom-inner">


    <div class="sumrow">


      <span

        class="count"

        id="count"

      >

        0 Artikel

      </span>



      <span class="sumlabel">

        Summe

      </span>



      <span

        class="total"

        id="total"

      >

        0,00 €

      </span>


    </div>



    <div class="controls">


      <button

        class="undo"

        onclick="
          undo()
        "
      >

        ↶ Zurück

      </button>



      <button

        class="cash"

        onclick="
          openCash()
        "
      >

        💶 BAR

      </button>



      <button

        class="reset"

        onclick="
          resetCart()
        "
      >

        NEUER GAST

      </button>


    </div>


  </div>


</div>



<!-- ========================================
     BARZAHLUNG
     ======================================== -->

<dialog id="cashDialog">


  <div class="modal">


    <h2>

      💶 Barzahlung

    </h2>



    <div class="to-pay-label">

      Gast muss zahlen

    </div>



    <div

      class="to-pay"

      id="cashTotal"

    >

      0,00 €

    </div>



    <div

      class="quick-cash"

      id="quickCash"

    ></div>



    <label

      class="cash-label"

      for="cashInput"

    >

      Gast gibt:

    </label>



    <input

      id="cashInput"

      type="text"

      inputmode="decimal"

      autocomplete="off"

      placeholder="z. B. 20"

      oninput="
        calculateChange()
      "

    >



    <div class="change-box">


      <div class="change-label">

        Rückgeld

      </div>



      <div

        class="change"

        id="change"

      >

        0,00 €

      </div>


    </div>



    <div class="modal-buttons">


      <button

        class="cancel"

        onclick="
          cashDialog.close()
        "
      >

        Abbrechen

      </button>



      <button

        class="paid"

        onclick="
          finishSale()
        "
      >

        BEZAHLT / NEUER GAST

      </button>


    </div>


  </div>


</dialog>

/* ========================================
   WARENKORB
   ======================================== */

let cart = {};

let history = [];



/* ========================================
   EURO FORMAT
   ======================================== */

const eur = number =>

  Number(number).toLocaleString(

    "de-DE",

    {

      style:
        "currency",

      currency:
        "EUR"

    }

  );



/* ========================================
   PRODUKT SCHLÜSSEL
   ======================================== */

function keyFor(
  name,
  size
){

  return name +
    "||" +
    size;

}



/* ========================================
   EINDEUTIGE ID
   ======================================== */

function safeId(text){


  let hash = 0;


  for(

    let i = 0;

    i < text.length;

    i++

  ){


    hash =

      ((hash << 5) - hash) +

      text.charCodeAt(i);


    hash |= 0;

  }


  return

    "q-" +

    Math.abs(hash) +

    "-" +

    encodeURIComponent(text)

      .replace(
        /[^a-zA-Z0-9]/g,
        ""
      )

      .slice(
        -20
      );

}



/* ========================================
   SEKT UND WEIN ANZEIGEN
   ======================================== */

function renderMulti(
  id,
  items
){


  document
    .getElementById(
      id
    )
    .innerHTML =


      `<div class="grid">` +


      items.map(

        item => {


          const full =

            item.opts.length === 3

            ? " full"

            : "";


          return `


            <div class="item${full}">


              <div class="item-name">

                ${item.name}

              </div>


              ${

                item.sub

                ? `

                    <div class="item-sub">

                      ${item.sub}

                    </div>

                  `

                : ""

              }


              <div

                class="options"

                style="
                  --cols:
                  ${item.opts.length}
                "
              >


                ${

                  item.opts.map(

                    ([size,price]) => {


                      const key =

                        keyFor(
                          item.name,
                          size
                        );


                      return `


                        <button

                          class="option"

                          id="${safeId(key)}"

                          onclick='

                            add(

                              ${JSON.stringify(
                                item.name +
                                " · " +
                                size
                              )},

                              ${price},

                              ${JSON.stringify(
                                key
                              )}

                            )

                          '
                        >


                          <span class="qty">

                            0

                          </span>


                          <span class="size">

                            ${size}

                          </span>


                          <span class="price">

                            ${eur(price)}

                          </span>


                        </button>


                      `;


                    }

                  ).join("")

                }


              </div>


            </div>


          `;


        }

      ).join("") +


      `</div>`;

}



/* ========================================
   EINZELARTIKEL ANZEIGEN
   ======================================== */

function renderSingle(
  id,
  items
){


  document
    .getElementById(
      id
    )
    .innerHTML =


      `<div class="single-grid">` +


      items.map(

        item => {


          const key =

            keyFor(
              item.name,
              item.size
            );


          return `


            <div class="single-card">


              <div class="single-name">

                ${item.name}

              </div>


              <button

                class="option"

                id="${safeId(key)}"

                onclick='

                  add(

                    ${JSON.stringify(
                      item.name +
                      " · " +
                      item.size
                    )},

                    ${item.price},

                    ${JSON.stringify(
                      key
                    )}

                  )

                '
              >


                <span class="qty">

                  0

                </span>


                <span class="size">

                  ${item.size}

                </span>


                <span class="price">

                  ${eur(
                    item.price
                  )}

                </span>


              </button>


            </div>


          `;


        }

      ).join("") +


      `</div>`;

}



/* ========================================
   MENÜ AUFBAUEN
   ======================================== */

function renderAll(){


  renderMulti(
    "sekt",
    data.sekt
  );


  renderMulti(
    "wein",
    data.wein
  );


  renderSingle(
    "soft",
    data.soft
  );


  renderSingle(
    "aperitif",
    data.aperitif
  );


  renderSingle(
    "snack",
    data.snack
  );

}



/* ========================================
   KATEGORIE WECHSELN
   ======================================== */

function showTab(
  id,
  button
){


  document
    .querySelectorAll(
      ".section"
    )
    .forEach(

      section =>

        section
          .classList
          .remove(
            "active"
          )

    );


  document
    .getElementById(
      id
    )
    .classList
    .add(
      "active"
    );



  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(

      tab =>

        tab
          .classList
          .remove(
            "active"
          )

    );


  button
    .classList
    .add(
      "active"
    );


  window.scrollTo({

    top:0,

    behavior:
      "instant"

  });

}



/* ========================================
   VERLAUF SPEICHERN
   ======================================== */

function snapshot(){


  history.push(

    JSON.stringify(
      cart
    )

  );


  if(
    history.length > 40
  ){

    history.shift();

  }

}



/* ========================================
   ARTIKEL HINZUFÜGEN
   ======================================== */

function add(
  name,
  price,
  key
){


  snapshot();


  if(
    !cart[key]
  ){


    cart[key] = {

      name:
        name,

      price:
        price,

      qty:
        0

    };


  }


  cart[key].qty++;


  update();


  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      15
    );

  }

}



/* ========================================
   ZURÜCK
   ======================================== */

function undo(){


  if(
    !history.length
  ){

    return;

  }


  cart =

    JSON.parse(

      history.pop()

    );


  update();

}



/* ========================================
   NEUER GAST
   ======================================== */

function resetCart(){


  cart = {};

  history = [];


  update();

}



/* ========================================
   SUMME
   ======================================== */

function getTotal(){


  let total = 0;


  for(

    const item

    of Object.values(
      cart
    )

  ){


    total +=

      item.price *

      item.qty;

  }


  return

    Math.round(

      total * 100

    ) / 100;

}



/* ========================================
   ANZAHL
   ======================================== */

function getCount(){


  let count = 0;


  for(

    const item

    of Object.values(
      cart
    )

  ){


    count +=
      item.qty;

  }


  return count;

}



/* ========================================
   ANZEIGE AKTUALISIEREN
   ======================================== */

function update(){


  document
    .querySelectorAll(
      ".option"
    )
    .forEach(

      button => {


        button
          .classList
          .remove(
            "selected"
          );


        const quantity =

          button.querySelector(
            ".qty"
          );


        if(
          quantity
        ){

          quantity.textContent =
            "0";

        }


      }

    );



  for(

    const [
      key,
      item
    ]

    of Object.entries(
      cart
    )

  ){


    if(
      item.qty <= 0
    ){

      continue;

    }


    if(

      key !==
      "pfand-plus"

      &&

      key !==
      "pfand-minus"

    ){


      const button =

        document.getElementById(

          safeId(
            key
          )

        );


      if(
        button
      ){


        button
          .classList
          .add(
            "selected"
          );


        button
          .querySelector(
            ".qty"
          )
          .textContent =

            item.qty;

      }


    }


  }



  document
    .getElementById(
      "count"
    )
    .textContent =

      getCount() +
      " Artikel";



  document
    .getElementById(
      "total"
    )
    .textContent =

      eur(
        getTotal()
      );

}



/* ========================================
   BARZAHLUNG
   ======================================== */

/* ========================================
   SCHNELLBETRÄGE
   ======================================== */

function createQuickCash(total){


  const standard =

    [
      5,
      10,
      20,
      50,
      100,
      200
    ];


  let buttons =

    standard

      .filter(

        amount =>
          amount >= total

      )

      .slice(
        0,
        4
      );


  if(
    buttons.length < 4
  ){


    buttons =

      standard.slice(
        -4
      );

  }


  document
    .getElementById(
      "quickCash"
    )
    .innerHTML =


      buttons.map(

        amount => `


          <button

            onclick="
              setCash(
                ${amount}
              )
            "
          >

            ${amount} €

          </button>


        `

      ).join("");

}



/* ========================================
   GELDBETRAG SETZEN
   ======================================== */

function setCash(amount){


  document
    .getElementById(
      "cashInput"
    )
    .value =

      amount;


  calculateChange();

}



/* ========================================
   KOMMA UND PUNKT LESEN
   ======================================== */

function parseCashValue(value){


  return Number(

    String(value)

      .trim()

      .replace(
        /\s/g,
        ""
      )

      .replace(
        ",",
        "."
      )

  ) || 0;

}



/* ========================================
   RÜCKGELD
   ======================================== */

function calculateChange(){


  const total =
    getTotal();


  const given =

    parseCashValue(

      document
        .getElementById(
          "cashInput"
        )
        .value

    );


  const difference =

    Math.round(

      (
        given -
        total
      ) * 100

    ) / 100;


  const changeElement =

    document.getElementById(
      "change"
    );


  if(
    difference >= 0
  ){


    changeElement
      .textContent =

        eur(
          difference
        );


    changeElement
      .style
      .color =

        "#17683a";


  }

  else{


    changeElement
      .textContent =

        "Fehlen " +

        eur(

          Math.abs(
            difference
          )

        );


    changeElement
      .style
      .color =

        "#b21f24";


  }

}



/* ========================================
   BEZAHLT
   ======================================== */

function finishSale(){


  const total =
    getTotal();


  const given =

    parseCashValue(

      document
        .getElementById(
          "cashInput"
        )
        .value

    );


  if(
    given < total
  ){


    alert(
      "Der Gast hat noch nicht genug gegeben."
    );


    return;

  }


  cashDialog.close();


  resetCart();

}
